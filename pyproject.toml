[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtmerge"
version = "1.0.0"
description = "A fast quartet-based method to infer large species trees from gene trees"
requires-python = ">=3.8"
dependencies = [
    "treeswift",
    "numpy",
    "scipy",
    "statsmodels",
]

[project.scripts]
qtmerge = "qtmerge.infer_trees:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qtmerge*"]
